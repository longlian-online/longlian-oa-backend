# https://taskfile.dev
# Atlas 数据库迁移任务

version: '3'

vars:
  ATLAS_DOCKER: docker run --rm -v {{.TASKFILE_DIR}}:/work -w /work --network="host" arigaio/atlas:latest
  DB_URL: mysql://root:dev@localhost:10001/longlian_oa_dev

tasks:
  update:
    desc: "应用所有未执行的迁移到数据库"
    silent: true
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - echo "正在同步数据库..."
      - '{{.ATLAS_DOCKER}} migrate apply --env local --url "{{.DB_URL}}"'
      - echo "数据库同步完成！"

  seed:
    desc: "导入开发环境种子数据"
    silent: true
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - echo "正在导入种子数据..."
      - docker run --rm -v {{.TASKFILE_DIR}}:/work -w /work --network="host" mysql:8.0 mysql -h 127.0.0.1 -P 10001 -u root -pdev longlian_oa_dev < seed/dev_data.sql
      - echo "种子数据导入完成！"

  diff:*:
    desc: "对比 schema.sql 与当前迁移状态，生成差异迁移文件"
    silent: true
    vars:
      NAME: '{{index .MATCH 0}}'
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - 'echo "正在生成迁移文件: {{.NAME}}"'
      - '{{.ATLAS_DOCKER}} migrate diff --env local {{.NAME}}'
      - 'echo "迁移文件生成完成！请检查 migrations/ 目录下的新文件。"'

  lint:
    desc: "检查迁移文件完整性与安全性"
    silent: true
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - echo "正在检查迁移文件..."
      - '{{.ATLAS_DOCKER}} migrate lint --env local --latest 1'
      - echo "迁移文件检查通过！"

  hash:
    desc: "重新生成 atlas.sum 校验文件"
    silent: true
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.ATLAS_DOCKER}} migrate hash --env local'
      - echo "atlas.sum 已更新"

  status:
    desc: "查看数据库迁移状态"
    silent: true
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.ATLAS_DOCKER}} migrate status --env local --url "{{.DB_URL}}"'
# https://taskfile.dev

version: '3'

tasks:
  update:
    desc: "同步数据库"
    silent: true
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - echo "正在同步数据库..."
      - docker run --rm -e INSTALL_MYSQL=true -v {{.TASKFILE_DIR}}:/liquibase/changelog  --network="host" liquibase/liquibase --defaults-file=/liquibase/changelog/liquibase.properties update
      - echo "数据库同步完成！"

  diff:*:*:
    silent: true
    vars:
      DATE:
        sh: date +%Y%m%d%H%M
      CHANGELOG: ./changelog/{{index .MATCH 0}}/{{.DATE}}__{{index .MATCH 1}}.mysql.sql
    desc: "生成数据库差异报告"
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - "echo \"正在生成数据库差异报告: {{.CHANGELOG}}\""
      - rm -rf {{.CHANGELOG}} # 删除旧的差异报告
      - docker run --rm -e INSTALL_MYSQL=true -v {{.TASKFILE_DIR}}:/liquibase/changelog  --network="host" liquibase/liquibase --defaults-file=/liquibase/changelog/liquibase.properties diff-changelog --changelog-file={{.CHANGELOG}}
      - "echo \"数据库差异报告生成完成！目标文件: {{.CHANGELOG}}\""