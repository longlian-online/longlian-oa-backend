server:
  shutdown: graceful

longlian:
  display-name: "longlian-oa" # 用于展示的系统名称
  datasource:
    type: ${DATASOURCE_TYPE:mysql}  # mysql 或 sqlite
  cache:
    type: ${CACHE_TYPE:redis}       # redis 或 local

spring:
  application:
    name: longlian-oa
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-circular-references: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:1}
  mail:
    host: ${NOTIFY_HOST}
    username: ${NOTIFY_USERNAME}
    password: ${NOTIFY_PASSWORD}
    port: ${NOTIFY_PORT}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_STARTTLS}
          ssl:
            enable: ${MAIL_SSL}

# SQLite 配置
sqlite:
  datasource:
    url: ${SQLITE_URL}

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: now()
      logic-not-delete-value: 'null'
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: online.longlian.app.common.handler.CodeEnumTypeHandler
debug: ${APP_DEBUG:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    enabled: ${SPRINGDOC_ENABLED:true}
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
storage:
  type: ${STORAGE_TYPE:LOCAL}   # LOCAL 或 OSS
  local:
    base-url: ${STORAGE_LOCAL_BASE_URL:}
    directory: ${STORAGE_LOCAL_DIRECTORY:${java.io.tmpdir}/longlian-oa}
  oss:
    bucket: ${STORAGE_OSS_BUCKET}
    region: ${STORAGE_OSS_REGION}
    secret-id: ${STORAGE_OSS_SECRET_ID}
    secret-key: ${STORAGE_OSS_SECRET_KEY}
    base-url: ${STORAGE_OSS_BASE_URL}
  cos:
    bucket: ${STORAGE_COS_BUCKET:}
    region: ${STORAGE_COS_REGION:}
    secret-id: ${STORAGE_COS_SECRET_ID:}
    secret-key: ${STORAGE_COS_SECRET_KEY:}
    url-prefix: ${STORAGE_COS_URL_PREFIX:}
cors:
  # 允许跨域访问的前端域名，多个用逗号分隔；不同环境通过 CORS_ALLOWED_ORIGINS 覆盖
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://sit.neo.oa.longlian.online}
notify:
  type: EMAIL
  email:
    template:
      path: classpath:templates/verify-code.html
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400
  header: Authorization
  prefix: Bearer
