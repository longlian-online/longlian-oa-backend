<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${displayName}</title>
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    <style>
        body, table, td, a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        table, td {
            mso-table-lspace: 0;
            mso-table-rspace: 0;
        }
        .notification-message p {
            margin: 0;
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f3f5f9; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f3f5f9" style="width: 100%; background-color: #f3f5f9;">
    <tr>
        <td align="center" style="padding: 48px 24px;">
            <!--[if mso]>
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td>
            <![endif]-->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width: 100%; max-width: 600px; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px;">
                <tr>
                    <td style="padding: 32px 36px; border-bottom: 1px solid #edf0f5;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; table-layout: fixed;">
                            <tr>
                                <td width="64" valign="middle" style="width: 64px;">
                                    <img src="https://longlian-oa-sit-1308050490.cos.ap-guangzhou.myqcloud.com/logo.jpg" alt="${displayName} Logo" width="48" height="48" style="display: block; width: 48px; height: 48px; border: 0; border-radius: 10px; color: #64748b; font-size: 12px;">
                                </td>
                                <td valign="middle" style="word-break: break-word; overflow-wrap: anywhere;">
                                    <p style="margin: 0 0 4px; color: #0f172a; font-size: 17px; font-weight: 600; line-height: 24px;">${displayName}</p>
                                    <p style="margin: 0; color: #64748b; font-size: 12px; line-height: 18px; letter-spacing: 2px;">协作通知</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 36px;">
                        <h1 style="margin: 0 0 24px; color: #0f172a; font-size: 26px; font-weight: 600; line-height: 36px;">你有一条新通知</h1>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f5f7fc" style="width: 100%; table-layout: fixed; background-color: #f5f7fc; border-radius: 10px;">
                            <tr>
                                <td class="notification-message" style="padding: 22px 24px; border-left: 3px solid #2563eb; color: #334155; font-size: 16px; line-height: 30px; word-break: break-word; overflow-wrap: anywhere;">
                                    <p>${message}</p>
                                </td>
                            </tr>
                        </table>
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top: 28px;">
                            <tr>
                                <td align="center" bgcolor="#2563eb" style="background-color: #2563eb; border-radius: 8px; mso-padding-alt: 14px 32px;">
                                    <a href="${link}" style="display: inline-block; padding: 14px 32px; border: 1px solid #2563eb; border-radius: 8px; color: #ffffff; font-size: 15px; font-weight: 600; line-height: 20px; text-align: center; text-decoration: none; mso-padding-alt: 0;">打开查看&nbsp; &rarr;</a>
                                </td>
                            </tr>
                        </table>
                        <p style="margin: 16px 0 0; color: #64748b; font-size: 13px; line-height: 22px;">前往工作台，查看通知详情。</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 22px 36px; border-top: 1px solid #edf0f5; color: #64748b; font-size: 12px; line-height: 22px; word-break: break-word; overflow-wrap: anywhere;">
                        <p style="margin: 0;">本邮件由 ${displayName} 自动发送，请勿回复。</p>
                    </td>
                </tr>
            </table>
            <!--[if mso]>
            </td></tr></table>
            <![endif]-->
        </td>
    </tr>
</table>
</body>
</html>
