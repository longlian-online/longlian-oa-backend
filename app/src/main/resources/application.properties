spring.ai.mcp.server.name=longlian-oa
spring.ai.mcp.server.instructions=Use the current user's identity and organization. Find the planning project, then its item and ordered tasks. Work only on the user's requested scope and tasks marked canClaim or canWork. Read existing drafts before editing. Download inputs and upload outputs on the client, then save the full draft. Drafts do not complete tasks or unlock later stages. Tell the user to review and submit on the website. Stop when no task is executable; query again when the user asks to continue. No formal submission or management tools are available.
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
