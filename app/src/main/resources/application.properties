spring.ai.mcp.server.name=longlian-oa
spring.ai.mcp.server.instructions=使用当前用户本人及当前组织的身份操作。先查找企划，再查找其下项目和按流程排序的任务。使用 list_my_tasks 或 list_claimable_tasks 查询当前组织范围内的任务。仅处理用户指定范围内的任务。canClaim 表示任务可以接取，包括后续阶段的任务。按顺序执行时，优先处理未被前置任务阻塞的任务；只有用户明确要求时才提前接取后续任务。接取后，仅在 canWork 为 true 时执行，否则等待 blockedBy 中的前置任务完成。修改前先读取已有暂存。在客户端下载输入材料、上传产出文件，然后保存完整暂存。暂存不会完成任务或解锁后续阶段。告知用户在网页审核并正式提交。没有可执行任务时停止，用户要求继续时再查询。只有用户明确要求时才放弃本人接取的任务，事先告知暂存将被清空，并传入当前任务修订号。不提供正式提交或管理工具。
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
