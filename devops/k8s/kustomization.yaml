# =============================================================================
# kustomize 聚合入口（默认全量部署：MySQL + Redis + 迁移 + 后端 + Ingress）
#
# 部署：kubectl apply -k devops/k8s
# 卸载：kubectl delete -k devops/k8s
#
# 注意：secret.yaml 提交的是占位值，部署前必须先按 README.md 替换为真实值。
# 已有外部 MySQL/Redis 时，删除 mysql.yaml、redis.yaml 与本文件对应条目，
# 并改 Secret 内 application-prod.yml 的连接地址（详见 README.md）。
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: longlian-oa

resources:
  - namespace.yaml
  - secret.yaml
  - storage.yaml
  - mysql.yaml
  - redis.yaml
  - migrate-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml