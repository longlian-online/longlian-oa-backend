# =============================================================================
# longlian-oa 集群内 Service（ClusterIP）
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: longlian-oa
  namespace: longlian-oa
  labels:
    app: longlian-oa
spec:
  type: ClusterIP
  selector:
    app: longlian-oa
  ports:
    - name: http
      port: 8080
      targetPort: http