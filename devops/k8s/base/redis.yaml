# =============================================================================
# 集群内 Redis 7（默认全量部署，与 docker-compose.dev.yml 的 redis-dev 等价）
#
# 说明：
#   - 应用配置 spring.data.redis.password 为空字符串（不设密码），
#     仅集群网络可达；如需加固可改用 Secret 注入 --requirepass 并同步配置。
#   - 开启 appendonly，缓存数据落盘到 PVC（Redis 重启不丢已写入的数据）。
#   - 不想用集群内 Redis（已有外部实例）时：删除本文件与 kustomization.yaml
#     中对应条目，并把 Secret 的 spring.data.redis.host 改回外部地址。
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: longlian-oa
  labels:
    app: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: longlian-oa
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: longlian-oa
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis