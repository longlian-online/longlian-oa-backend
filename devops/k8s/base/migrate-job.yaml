# =============================================================================
# longlian-oa 数据库迁移 Job（Atlas 声明式同步）
#
# 对应 docker-compose.prod.yml 中 migrate 服务：
#   - 镜像 docker.cnb.cool/longlian.online/longlian-oa-backend:migration-latest
#   - 从挂载的 /app/config/application.yml 的 spring.datasource 推导 DB_URL
#   - 在同一 MariaDB 实例自动创建 {db}_atlas 影子库（需 CREATE DATABASE 权限，
#     没有该权限时先预建影子库并在本 Job 设置 DEV_DB_URL 环境变量）
#
# 发布新版本（有 schema 变更）时重跑本 Job：
#   kubectl delete job migrate -n longlian-oa --ignore-not-found
#   # 把 image tag 改为对应版本（如 1.2.3-migration）
#   kubectl apply -k devops/k8s/overlays/prod
#   kubectl wait --for=condition=complete job/migrate -n longlian-oa --timeout=300s
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: longlian-oa
  labels:
    app: longlian-oa
    component: migrate
spec:
  # 失败自动重试（OnFailure 模式由 kubelet 直接重启容器）
  backoffLimit: 3
  # 结束后自动清理 Job 及其 Pod，避免占用 etcd
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: longlian-oa
        component: migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        # kubelet 校验 runAsNonRoot 要求数字 UID；镜像 USER 是 appuser
        # （alpine:3.20: uid=998 gid=998，见 devops/Dockerfile.migration）
        runAsNonRoot: true
        runAsUser: 998
        runAsGroup: 998
      containers:
        - name: migrate
          # 迁移镜像 tag 与发布版本对应：v1.2.3 → :1.2.3-migration，
          # 非预发布同时打 :migration-latest（见 .github/workflows/publish-docker.yml）
          image: docker.cnb.cool/longlian.online/longlian-oa-backend:migration-latest
          args: ["prod", "apply"]
          volumeMounts:
            - name: app-config
              mountPath: /app/config/application.yml
              subPath: application-prod.yml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: app-config
          secret:
            secretName: longlian-oa-config
            items:
              - key: application-prod.yml
                path: application-prod.yml