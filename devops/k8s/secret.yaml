# =============================================================================
# longlian-oa 部署配置 Secret（longlian-oa-config）
#
# ⚠️ 警告：本文件内所有值均为「占位符」，部署前必须全部替换为真实值。
#    直接使用占位值：数据库/Redis/邮件不可达，JWT 密钥可被伪造登录。
#
# 本 Secret 包含以下 key：
#   application-prod.yml   应用配置（应用 + 迁移镜像挂载为 /app/config/application.yml）
#   mysql-init.sql         MySQL 首次初始化脚本（longlian 应用账号 + 影子库 + 授权）
#   mysql-root-password    MySQL root 密码（供 mysql.yaml 使用）
#
# 默认全量部署（集群内 MySQL/Redis）：直接编辑本文件替换占位值后 apply 即可。
#   - spring.datasource 指向集群内 mysql 服务；spring.data.redis 指向 redis 服务
#   - application-prod.yml 中 spring.datasource.password 必须与
#     mysql-init.sql 中 IDENTIFIED BY 的密码保持一致
#   - jwt.secret 必须换成 ≥32 字节的高强度随机串
#
# 仅部署后端（外部 MySQL/Redis，docker-compose 同款方式，可删除 mysql.yaml / redis.yaml）：
#   cp devops/application-prod.yml.example devops/application-prod.yml
#   # 编辑 devops/application-prod.yml 填写外部实例地址与密钥
#   kubectl create secret generic longlian-oa-config \
#     --from-file=application-prod.yml=devops/application-prod.yml \
#     --namespace longlian-oa --dry-run=client -o yaml | kubectl apply -f -
#   （该命令会覆盖本 Secret，移除 mysql-init.sql / mysql-root-password 两个 key，
#     因此仅适合「外部组件」模式；全量部署请直接改本文件）
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: longlian-oa-config
  namespace: longlian-oa
  labels:
    app: longlian-oa
type: Opaque
stringData:
  # --------------------------------------------------------------------------
  # 应用配置：Deployment / migrate Job 通过 subPath 挂载为 /app/config/application.yml
  # --------------------------------------------------------------------------
  application-prod.yml: |
    # longlian-oa 生产配置（存放于 k8s Secret: longlian-oa-config）
    server:
      shutdown: graceful

    longlian:
      display-name: "longlian-oa"
      datasource:
        type: mysql
      cache:
        type: redis

    spring:
      application:
        name: longlian-oa
      profiles:
        active: prod
      main:
      lifecycle:
        timeout-per-shutdown-phase: 30s

      datasource:
        # 集群内 MySQL（见 mysql.yaml）；mysql-init.sql 会创建 longlian 账号
        url: jdbc:mysql://mysql:3306/longlian_oa?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
        username: longlian
        # 必须与下方 mysql-init.sql 中 IDENTIFIED BY 的密码一致
        password: CHANGE_ME_DB_PASSWORD

      data:
        redis:
          # 集群内 Redis（见 redis.yaml）
          host: redis
          port: 6379
          # 集群内 Redis 默认不设密码（仅集群网络可达），如启用密码需同时改 Redis args
          password: ""
          database: 1
      mail:
        host: ""
        username: ""
        password: ""
        # 465 配 ssl.enable=true；587 配 starttls.enable=true
        port: 465
        properties:
          mail:
            smtp:
              auth: true
              starttls:
                enable: false
              ssl:
                enable: true

    mybatis-plus:
      global-config:
        db-config:
          logic-delete-field: deletedAt
          logic-delete-value: now()
          logic-not-delete-value: 'null'
      configuration:
        log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
        default-enum-type-handler: online.longlian.app.common.handler.CodeEnumTypeHandler

    debug: false

    springdoc:
      swagger-ui:
        path: /swagger-ui.html
        operationsSorter: method
        tagsSorter: alpha
        enabled: false
      api-docs:
        enabled: false

    storage:
      # LOCAL | OSS | COS
      type: LOCAL
      local:
        base-url: ""
        signing-secret: ${STORAGE_LOCAL_SIGNING_SECRET:${jwt.secret}}
        read-url-ttl-seconds: 300
        directory: /app/data/storage
      oss:
        bucket: ""
        region: ""
        secret-id: ""
        secret-key: ""
        base-url: ""
      cos:
        bucket: ""
        region: ""
        secret-id: ""
        secret-key: ""
        url-prefix: ""

    cors:
      # 必须包含前端实际 Origin（Ingress 域名或 CDN 域名）
      allowed-origins: https://oa.longlian.online

    notify:
      type: EMAIL
      email:
        template:
          path: classpath:templates/verify-code.html

    jwt:
      # HS256 至少 32 字节。生产必须换成高强度随机串，泄露等于可伪造登录
      secret: CHANGE_ME_JWT_SECRET_AT_LEAST_32_BYTES_LONG_RANDOM_STRING
      expiration: 86400
      header: Authorization
      prefix: Bearer

  # --------------------------------------------------------------------------
  # MySQL 首次初始化脚本（mysql 镜像 /docker-entrypoint-initdb.d，仅在数据卷为空时执行）
  # 由 mysql.yaml 挂载；密码必须与 application-prod.yml 的 datasource.password 一致
  # --------------------------------------------------------------------------
  mysql-init.sql: |
    -- 业务库由镜像环境变量 MYSQL_DATABASE 创建，这里补建 Atlas 影子库与应用账号
    CREATE DATABASE IF NOT EXISTS longlian_oa_atlas CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
    CREATE USER IF NOT EXISTS 'longlian'@'%' IDENTIFIED BY 'CHANGE_ME_DB_PASSWORD';
    ALTER USER 'longlian'@'%' IDENTIFIED BY 'CHANGE_ME_DB_PASSWORD';
    GRANT ALL PRIVILEGES ON longlian_oa.* TO 'longlian'@'%';
    GRANT ALL PRIVILEGES ON longlian_oa_atlas.* TO 'longlian'@'%';
    -- migrate.sh 会尝试 CREATE DATABASE IF NOT EXISTS {db}_atlas，需全局 CREATE 权限；
    -- 影子库仅存临时 schema，不承载业务数据
    GRANT CREATE ON *.* TO 'longlian'@'%';
    FLUSH PRIVILEGES;

  # --------------------------------------------------------------------------
  # MySQL root 密码（供 mysql.yaml 的 MYSQL_ROOT_PASSWORD 使用）
  # 仅用于数据库管理（kubectl exec 登录、备份等），应用不走 root
  # --------------------------------------------------------------------------
  mysql-root-password: CHANGE_ME_MYSQL_ROOT_PASSWORD