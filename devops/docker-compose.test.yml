# ============================================================
# longlian-oa-backend 完整测试 Docker 运行环境
#
# 一键运行：
#   docker compose -f devops/docker-compose.test.yml up --build --exit-code-from test-runner
#
# 包含：MariaDB 10.11 + Redis 7-Alpine + Maven 测试执行器
# ============================================================

services:
  mariadb-test:
    image: mariadb:10.11.19
    container_name: longlian-oa-mariadb-test
    environment:
      MARIADB_ROOT_PASSWORD: testpass
      MARIADB_DATABASE: longlian_oa_test
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_520_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 15s
    tmpfs: /var/lib/mysql

  redis-test:
    image: redis:7-alpine
    container_name: longlian-oa-redis-test
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  test-runner:
    image: maven:3.9-eclipse-temurin-21
    container_name: longlian-oa-test-runner
    depends_on:
      mariadb-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      # 挂载项目源码
      - ..:/app
      # 挂载 settings.xml（阿里云镜像）
      - ../settings.xml:/usr/share/maven/conf/settings.xml
      # 本地默认使用 named volume；CI 可通过 MAVEN_REPOSITORY 挂载可缓存的宿主机目录
      - ${MAVEN_REPOSITORY:-maven-repo}:/root/.m2
    working_dir: /app
    entrypoint:
      - sh
      - -c
      - >
        echo "等待服务完全就绪..."
        && sleep 15
        && mvn -pl app install -Dmaven.test.skip=true -am --no-transfer-progress
        && mvn -pl app test jacoco:report -e
        && mvn -pl app test jacoco:report -Papi-test -e

volumes:
  maven-repo:
