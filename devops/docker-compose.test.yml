# ============================================================
# longlian-oa-backend API 测试 Docker 运行环境
#
# 一键运行：
#   docker compose -f devops/docker-compose.test.yml up --build --exit-code-from test-runner
#
# 包含：PostgreSQL 16 + Redis 7-Alpine + Maven 测试执行器
# ============================================================

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: longlian-oa-postgres-test
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: longlian_oa_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    tmpfs: /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    container_name: longlian-oa-redis-test
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  test-runner:
    image: maven:3.9-eclipse-temurin-21
    container_name: longlian-oa-test-runner
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    env_file:
      - ../.env.test
    volumes:
      # 挂载项目源码
      - ..:/app
      # 挂载 settings.xml（阿里云镜像）
      - ../settings.xml:/usr/share/maven/conf/settings.xml
      # 本地默认使用 named volume；CI 可通过 MAVEN_REPOSITORY 挂载可缓存的宿主机目录
      - ${MAVEN_REPOSITORY:-maven-repo}:/root/.m2
    working_dir: /app
    entrypoint:
      - sh
      - -c
      - >
        echo "等待服务完全就绪..."
        && sleep 15
        && mvn -pl app install -Dmaven.test.skip=true -am --no-transfer-progress
        && mvn -pl app test jacoco:report -e

volumes:
  maven-repo:
