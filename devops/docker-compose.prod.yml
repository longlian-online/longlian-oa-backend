# 生产环境
#
# 部署 Atlas 迁移、后端和 VictoriaLogs。MariaDB、Redis、邮件等由外部提供，
# 本文件不创建这些组件。
#
# 准备：
#   cp devops/application-prod.yml.example devops/application-prod.yml
#   填写外部地址与密钥
# 启动：
#   task prod
# 停止：
#   task prod-down
#
# 应用配置挂载为 /app/config/application.yml。
# 存储、CDN、密钥等项直接写在 YAML 中。
# 本地上传目录和 VictoriaLogs 数据 bind 到 ./data，便于备份和迁移。
# 不要用 named volume：文件会藏进 Docker 卷目录，down -v 易误删。
# 容器以非 root 的 appuser 写入上传目录；task prod 会先建目录并 chmod 1777。
# 迁移从同一份 YAML 的 spring.datasource 推导连接，
# 并在同一实例自动创建 {db}_atlas。

name: longlian-oa-prod

services:
  fcaptcha:
    # 通用自建人机验证服务。浏览器走 HTTPS 反代；后端经内网验票。
    image: ghcr.io/webdecoy/fcaptcha:1.50.1
    container_name: longlian-oa-fcaptcha-prod
    restart: unless-stopped
    environment:
      FCAPTCHA_SECRET: ${FCAPTCHA_SECRET:?FCAPTCHA_SECRET 必填，用 openssl rand -hex 32 生成}
      FCAPTCHA_VERIFY_SECRET: ${FCAPTCHA_VERIFY_SECRET:?FCAPTCHA_VERIFY_SECRET 必填，单独生成}
      FCAPTCHA_SITE_KEYS: ${FCAPTCHA_SITE_KEYS:-longlian-oa-prod}
      FCAPTCHA_ALLOWED_HOSTNAMES: ${FCAPTCHA_ALLOWED_HOSTNAMES:?FCAPTCHA_ALLOWED_HOSTNAMES 必填，填页面域名}
      # 按实际反代网段填写；错误设置会让访客都归到代理地址上
      TRUSTED_PROXIES: ${FCAPTCHA_TRUSTED_PROXIES:-}
      # 挑战与已消费票据放到 Redis，避免重启或多实例丢失状态
      REDIS_URL: ${FCAPTCHA_REDIS_URL:-}
    # 仅内网验票与健康检查使用；对外访问一律走 HTTPS 反代
    ports:
      - "127.0.0.1:13000:3000"

  migrate:
    image: ghcr.io/longlian-online/longlian-oa-backend:migration-latest
    container_name: longlian-oa-migrate-prod
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./application-prod.yml:/app/config/application.yml:ro

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: longlian-oa-victorialogs-prod
    command:
      - -storageDataPath=/victoria-logs-data
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - ./data/victorialogs:/victoria-logs-data
    restart: unless-stopped

  longlian-oa:
    image: ghcr.io/longlian-online/longlian-oa-backend:latest
    container_name: longlian-oa-prod
    restart: unless-stopped
    volumes:
      - ./application-prod.yml:/app/config/application.yml:ro
      - ./data/storage:/app/data/storage
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_SERVICE_NAME: longlian-oa
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=prod
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://victorialogs:9428/insert/opentelemetry/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      victorialogs:
        condition: service_started

