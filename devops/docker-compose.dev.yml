# 开发环境
#
# 一键启动：
#   task dev
#   docker compose -f devops/docker-compose.dev.yml up --build -d
#
# 包含：MySQL 8.0 + Redis 7-Alpine + Atlas 迁移（含种子）+ 应用
# 应用 / 迁移共用：devops/application-dev.yml.example → /app/config/application.yml
#
# 迁移在同一 MySQL 实例自动创建 longlian_oa_dev_atlas 作暂存库。

services:
  mysql-dev:
    image: mysql:8.0
    container_name: longlian-oa-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: longlian_oa_dev
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "10001:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - mysql_data:/var/lib/mysql

  redis-dev:
    image: redis:7-alpine
    container_name: longlian-oa-redis-dev
    ports:
      - "10002:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate-dev:
    build:
      context: ../
      dockerfile: devops/Dockerfile.migration
    container_name: longlian-oa-migrate-dev
    restart: "no"
    command: ["dev", "apply"]
    environment:
      SEED_FILE: /app/db/seed/dev_data.sql
    volumes:
      - ../db:/app/db:ro
      - ./application-dev.yml.example:/app/config/application.yml:ro
    depends_on:
      mysql-dev:
        condition: service_healthy

  longlian-oa-dev:
    build:
      context: ../
      dockerfile: devops/Dockerfile
    container_name: longlian-oa-dev
    volumes:
      - ./application-dev.yml.example:/app/config/application.yml:ro
    ports:
      - "10003:8080"
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
      redis-dev:
        condition: service_healthy

volumes:
  mysql_data:
