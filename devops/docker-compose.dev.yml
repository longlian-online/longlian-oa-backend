# 开发环境

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: longlian-oa-postgres-dev
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: longlian_oa_dev
    ports:
      - "10001:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis-dev:
    image: redis:7-alpine
    container_name: longlian-oa-redis-dev
    ports:
      - "10002:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
  longlian-oa-dev:
    build:
      context: ../
      dockerfile: devops/Dockerfile
    container_name: longlian-oa-dev
    env_file:
      - ../.env.dev
    ports:
      - "10003:8080"
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
volumes:
  postgres_data: