# 开发环境
#
# 一键启动：
#   task dev
#   docker compose -f devops/docker-compose.dev.yml up --build -d
#
# 包含：MariaDB 10.11 + Redis 7-Alpine + Atlas 迁移（含种子）+ 应用
# 应用同时挂载本地基础配置和开发 profile 配置；Spring Boot 按 profile 合并。
# compose 用 SPRING_DATASOURCE_URL / SPRING_DATA_REDIS_* 覆盖基础配置的本机连接。
# 迁移在同一 MariaDB 实例自动创建 longlian_oa_dev_atlas 作暂存库。

services:
  mariadb-dev:
    image: mariadb:10.11.19
    container_name: longlian-oa-mariadb-dev
    environment:
      MARIADB_ROOT_PASSWORD: dev
      MARIADB_DATABASE: longlian_oa_dev
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_520_ci
      - --default-time-zone=+08:00
    ports:
      - "10001:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - mariadb_data:/var/lib/mysql

  redis-dev:
    image: redis:7-alpine
    container_name: longlian-oa-redis-dev
    ports:
      - "10002:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate-dev:
    build:
      context: ../
      dockerfile: devops/Dockerfile.migration
    container_name: longlian-oa-migrate-dev
    restart: "no"
    command: ["dev", "apply"]
    environment:
      DB_URL: maria://root:dev@mariadb-dev:3306/longlian_oa_dev
      SEED_FILE: /app/db/seed/dev_data.sql
    volumes:
      - ../db:/app/db:ro
    depends_on:
      mariadb-dev:
        condition: service_healthy

  longlian-oa-dev:
    build:
      context: ../
      dockerfile: devops/Dockerfile
    container_name: longlian-oa-dev
    volumes:
      - ../app/src/main/resources/application.yml:/app/config/application.yml:ro
      - ../app/src/main/resources/application-dev.yml:/app/config/application-dev.yml:ro
      - local_storage_data:/app/data/storage
    environment:
      # 覆盖基础配置中的 localhost:10001/10002，改走 compose 网络
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-dev:3306/longlian_oa_dev?sslMode=disable&timezone=%2B08:00
      SPRING_DATA_REDIS_HOST: redis-dev
      SPRING_DATA_REDIS_PORT: "6379"
      STORAGE_LOCAL_DIRECTORY: /app/data/storage
    ports:
      - "10003:8080"
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
      redis-dev:
        condition: service_healthy

volumes:
  mariadb_data:
  local_storage_data:
