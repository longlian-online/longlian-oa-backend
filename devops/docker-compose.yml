# 环境用 profile 区分，不要同时起多个：
#   task dev / task prod / task api-test-docker
#   docker compose -f devops/docker-compose.yml -p longlian-oa-dev --profile dev up --build -d
#
# 开发环境（profile=dev）
#   包含：MySQL 8.0 + Redis 7-Alpine + Atlas 迁移（含种子）+ 应用
#   应用配置：挂载 app/.../application.yml.example → /app/config/application.yml
#   compose 用 SPRING_DATASOURCE_URL / SPRING_DATA_REDIS_* 覆盖为本机服务名
#   迁移在同一 MySQL 实例自动创建 longlian_oa_dev_atlas 作暂存库
#
# API 测试（profile=test）
#   包含：MySQL 8.0 + Redis 7-Alpine + Maven 测试执行器
#   一键运行：task api-test-docker
#
# 生产环境（profile=prod）
#   仅部署 Atlas 迁移 + 后端。MySQL、Redis、邮件等由外部提供，
#   本文件不创建这些组件。
# 准备：
#   cp devops/application-prod.yml.example devops/application-prod.yml
# 启动 / 停止：
#   task prod
#   task prod-down
# 应用与迁移共用 application-prod.yml（挂到 /app/config/application.yml）。
# 迁移从 spring.datasource 推导连接，并在同一实例自动建 {db}_atlas。
# 可选 devops/.env 钉死镜像：
#   APP_IMAGE=ghcr.io/longlian-online/longlian-oa-backend:1.2.3
#   MIGRATION_IMAGE=ghcr.io/longlian-online/longlian-oa-backend:1.2.3-migration
#   # CNB：docker.cnb.cool/longlian.online/longlian-oa-backend

services:
  mysql-dev:
    profiles: [dev]
    image: mysql:8.0
    container_name: longlian-oa-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: longlian_oa_dev
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "10001:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - mysql_data:/var/lib/mysql

  redis-dev:
    profiles: [dev]
    image: redis:7-alpine
    container_name: longlian-oa-redis-dev
    ports:
      - "10002:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate-dev:
    profiles: [dev]
    build:
      context: ../
      dockerfile: devops/Dockerfile
      target: migration
    container_name: longlian-oa-migrate-dev
    restart: "no"
    command: ["dev", "apply"]
    environment:
      DB_URL: mysql://root:dev@mysql-dev:3306/longlian_oa_dev
      SEED_FILE: /app/db/seed/dev_data.sql
    volumes:
      - ../db:/app/db:ro
    depends_on:
      mysql-dev:
        condition: service_healthy

  longlian-oa-dev:
    profiles: [dev]
    build:
      context: ../
      dockerfile: devops/Dockerfile
      target: app
    container_name: longlian-oa-dev
    volumes:
      - ../app/src/main/resources/application.yml.example:/app/config/application.yml:ro
    environment:
      # 覆盖本地模板里的 localhost:10001/10002，改走 compose 网络
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-dev:3306/longlian_oa_dev?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: redis-dev
      SPRING_DATA_REDIS_PORT: "6379"
    ports:
      - "10003:8080"
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
      redis-dev:
        condition: service_healthy

  mysql-test:
    profiles: [test]
    image: mysql:8.0
    container_name: longlian-oa-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_DATABASE: longlian_oa_test
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 15s
    tmpfs: /var/lib/mysql

  redis-test:
    profiles: [test]
    image: redis:7-alpine
    container_name: longlian-oa-redis-test
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  test-runner:
    profiles: [test]
    image: maven:3.9-eclipse-temurin-21
    container_name: longlian-oa-test-runner
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      # 挂载项目源码
      - ..:/app
      # 挂载 settings.xml（阿里云镜像）
      - ../settings.xml:/usr/share/maven/conf/settings.xml
      # 本地默认使用 named volume；CI 可通过 MAVEN_REPOSITORY 挂载可缓存的宿主机目录
      - ${MAVEN_REPOSITORY:-maven-repo}:/root/.m2
    working_dir: /app
    entrypoint:
      - sh
      - -c
      - >
        echo "等待服务完全就绪..."
        && sleep 15
        && mvn -pl app install -Dmaven.test.skip=true -am --no-transfer-progress
        && mvn -pl app test jacoco:report -e

  migrate:
    profiles: [prod]
    image: ${MIGRATION_IMAGE:-ghcr.io/longlian-online/longlian-oa-backend:migration-latest}
    container_name: longlian-oa-migrate-prod
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./application-prod.yml:/app/config/application.yml:ro

  longlian-oa:
    profiles: [prod]
    image: ${APP_IMAGE:-ghcr.io/longlian-online/longlian-oa-backend:latest}
    container_name: longlian-oa-prod
    restart: unless-stopped
    volumes:
      - ./application-prod.yml:/app/config/application.yml:ro
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mysql_data:
  maven-repo:
