# 本地开发环境可观测性覆盖配置。
#
# 用法：
#   task dev-observability
#
# 应用通过 Java Agent 将 Logback 日志以 OTLP Logs 发送到 Collector，
# Collector 再写入 VictoriaLogs。查询使用官方 vlogscli，不引入项目内查询服务。

services:
  migrate-dev:
    # MySQL healthcheck 通过后，服务端可能仍处于最后初始化阶段；有限重试
    # 避免本地首次启动时的瞬时 connection refused。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for attempt in $(seq 1 10); do
          /app/db/migrate.sh dev apply && exit 0
          echo "数据库迁移暂未就绪，$${attempt}/10，3 秒后重试..." >&2
          sleep 3
        done
        exit 1

  longlian-oa-dev:
    build:
      args:
        INCLUDE_OTEL: "true"
    volumes: !override
      - ../app/src/main/resources/application.yml.example:/app/config/application.yml:ro
      - ../app/src/main/resources/application-dev.yml:/app/config/application-dev.yml:ro
      - local_storage_data:/app/data/storage
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_SERVICE_NAME: longlian-oa
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev,service.version=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
    depends_on:
      otel-collector:
        condition: service_started

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: longlian-oa-victorialogs
    command:
      - -storageDataPath=/victoria-logs-data
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - ../data/victorialogs:/victoria-logs-data
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    container_name: longlian-oa-otel-collector
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      victorialogs:
        condition: service_started
    restart: unless-stopped

volumes:
  local_storage_data:
