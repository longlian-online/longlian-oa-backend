server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: log-query-gateway

log-query-gateway:
  victoria-logs:
    query-url: ${VICTORIALOGS_QUERY_URL:http://localhost:9428/select/logsql/query}
    connect-timeout: ${VICTORIALOGS_CONNECT_TIMEOUT:2s}
    read-timeout: ${VICTORIALOGS_READ_TIMEOUT:10s}
  query:
    default-range: ${LOG_QUERY_DEFAULT_RANGE:15m}
    max-range: ${LOG_QUERY_MAX_RANGE:24h}
    max-limit: ${LOG_QUERY_MAX_LIMIT:200}
    max-concurrent: ${LOG_QUERY_MAX_CONCURRENT:8}
  auth:
    required: ${LOG_QUERY_AUTH_REQUIRED:true}
    token: ${LOG_QUERY_AUTH_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
