name: All Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, release/v1.0.0 ]
  pull_request:
    branches: [ main, release/v1.0.0 ]

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
              ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Maven cache key
        id: m2key
        run: echo "hash=$(python3 devops/ci/m2-cache-key.py)" >> "$GITHUB_OUTPUT"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: .ci-cache/m2
          # 发版只改 pom 版本时 key 不变，避免每打一个 tag 再存一份数 GB 仓库。
          # maven- 前缀是旧 key，第一次切换时还能命中。
          key: m2-${{ runner.os }}-${{ steps.m2key.outputs.hash }}
          restore-keys: |
            m2-${{ runner.os }}-
            maven-${{ runner.os }}-

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.50.0
      - name: Run all tests in Docker
        run: |
          mkdir -p .ci-cache/m2
          task test-docker
        env:
          MAVEN_REPOSITORY: ${{ github.workspace }}/.ci-cache/m2


      - name: Dump test logs on failure
        if: failure()
        run: |
          echo "=== Surefire test reports ==="
          find app/target/surefire-reports -name "*.txt" -exec echo "--- {} ---" \; -exec cat {} \;
        continue-on-error: true

      - name: Report results to DeepSource
        # 测试失败时也要上报，否则 DeepSource 上的覆盖率会停留在上一次成功的值
        if: always()
        run: |
          # 安装CLI
          curl -fsSL https://cli.deepsource.com/install | BINDIR=./bin sh

          # 上报数据
          ./bin/deepsource report --analyzer test-coverage --key java --value-file app/target/site/jacoco/jacoco.xml
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
