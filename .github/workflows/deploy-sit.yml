# 推送 sit 时只构建并推送固定标签，不部署。
# 应用镜像: :sit
# 迁移镜像: :sit-migration
# 不带版本号。
#
# 测试服部署在 CNB 的 sit 推送流水线里。GitHub Actions 不 SSH。
# 同一时刻只构建一轮。排队期间 sit 又有新提交时，旧提交跳过推送，避免覆盖新镜像。
name: Publish sit images

on:
  push:
    branches:
      - sit

concurrency:
  group: sit-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/publish-images.yml
    secrets:
      GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
    with:
      tip-branch: sit
      app-tags: |
        type=raw,value=sit
      migration-tags: |
        type=raw,value=sit-migration
