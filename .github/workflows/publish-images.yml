# 构建并推送镜像，不部署。
#
# sit 分支 → :sit 与 :sit-migration
# vX.Y.Z 标签 → :X.Y.Z 与 :X.Y.Z-migration
#
# 镜像同时推到 ghcr.io/<owner>/<repo> 和 docker.cnb.cool/longlian.online/longlian-oa-backend。
# CNB 推送使用仓库 Secret GIT_PASSWORD，用户名固定为 cnb。
#
# Maven 缓存来自 main 上的测试。sit 若已有更新的提交，旧的一轮不推送，避免覆盖新镜像。
name: Publish images

on:
  push:
    branches:
      - sit
    tags:
      - "v*.*.*"

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # 覆盖默认权限后，恢复 Actions cache 需要显式打开。
      actions: read
    env:
      GHCR_REGISTRY: ghcr.io
      CNB_REGISTRY: docker.cnb.cool
      GHCR_IMAGE: ${{ github.repository }}
      CNB_IMAGE: longlian.online/longlian-oa-backend
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Skip superseded sit builds
        id: gate
        run: |
          set -Eeuo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin refs/heads/sit
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip: origin/sit is ${tip}, this run is ${GITHUB_SHA}"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        id: buildx
        if: success() && steps.gate.outputs.proceed == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Maven cache key
        id: m2key
        if: success() && steps.gate.outputs.proceed == 'true'
        run: echo "hash=$(python3 devops/ci/m2-cache-key.py)" >> "$GITHUB_OUTPUT"

      - name: Restore Maven repository
        if: success() && steps.gate.outputs.proceed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/m2
          key: m2-${{ runner.os }}-${{ steps.m2key.outputs.hash }}
          restore-keys: |
            m2-${{ runner.os }}-
            maven-${{ runner.os }}-

      - name: Ensure Maven cache directory
        if: success() && steps.gate.outputs.proceed == 'true'
        run: mkdir -p .ci-cache/m2

      - name: Inject Maven cache into BuildKit
        if: success() && steps.gate.outputs.proceed == 'true'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              ".ci-cache/m2": {
                "target": "/root/.m2",
                "id": "m2"
              }
            }
          skip-extraction: true

      - name: Log in to GHCR
        if: success() && steps.gate.outputs.proceed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to CNB
        if: success() && steps.gate.outputs.proceed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.CNB_REGISTRY }}
          username: cnb
          password: ${{ secrets.GIT_PASSWORD }}

      - name: Recheck sit before pushing
        id: recheck
        if: success() && steps.gate.outputs.proceed == 'true'
        run: |
          set -Eeuo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin refs/heads/sit
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip push: origin/sit is ${tip}, this run is ${GITHUB_SHA}"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image tags
        id: image-tags
        if: success() && steps.recheck.outputs.proceed == 'true'
        run: |
          set -Eeuo pipefail
          write_tags() {
            {
              echo "app<<EOF"
              printf '%s\n' "$1"
              echo "EOF"
              echo "migration<<EOF"
              printf '%s\n' "$2"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }
          if [ "${{ github.ref_type }}" = "tag" ]; then
            write_tags "type=semver,pattern={{version}}" "type=semver,pattern={{version}}-migration"
          else
            write_tags "type=raw,value=sit" "type=raw,value=sit-migration"
          fi

      - name: Extract Docker metadata (app)
        id: meta
        if: success() && steps.recheck.outputs.proceed == 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
            ${{ env.CNB_REGISTRY }}/${{ env.CNB_IMAGE }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.image-tags.outputs.app }}

      - name: Build and push app image
        id: app
        if: success() && steps.recheck.outputs.proceed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./devops/Dockerfile
          build-args: |
            INCLUDE_OTEL=true
          push: true
          platforms: linux/amd64
          # CNB Docker 制品库拒绝 Buildx 默认附带的 provenance attestation。
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Extract Docker metadata (migration)
        id: meta-migration
        if: success() && steps.recheck.outputs.proceed == 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
            ${{ env.CNB_REGISTRY }}/${{ env.CNB_IMAGE }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.image-tags.outputs.migration }}

      - name: Build and push migration image
        id: migration
        if: success() && steps.recheck.outputs.proceed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./devops/Dockerfile.migration
          push: true
          platforms: linux/amd64
          # 与应用镜像保持一致，避免 CNB 拒绝 provenance attestation。
          provenance: false
          tags: ${{ steps.meta-migration.outputs.tags }}
          labels: ${{ steps.meta-migration.outputs.labels }}
          annotations: ${{ steps.meta-migration.outputs.annotations }}

