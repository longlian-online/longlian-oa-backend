# 推送 semver tag 时构建、发布并部署应用与 migration 镜像。
# 镜像:
#   ghcr.io/<owner>/<repo>
#   docker.cnb.cool/longlian.online/longlian-oa-backend
# （linux/amd64）
# 应用镜像:
#   任意 semver tag → :<version> :<major>.<minor> :latest
# 迁移镜像:
#   任意 semver tag → :<version>-migration :<major>.<minor>-migration :migration-latest
#
# CNB 推送需仓库 Secrets: GIT_PASSWORD（CNB 访问令牌，用户名固定 cnb；需制品库写权限）
#
# 依赖来自 main 上 All Tests 写入的 Actions cache（tag 工作流读得到 main 的 cache，写出去的下一发 tag 读不到）。
# 不再用 type=gha,mode=max：层缓存会被 pom 版本打穿，导出本身要数分钟，而且仓库 cache 配额只有 10GB。
name: Publish and deploy Docker images

on:
  push:
    tags:
      - "v*.*.*"

env:
  GHCR_REGISTRY: ghcr.io
  CNB_REGISTRY: docker.cnb.cool
  GHCR_IMAGE: ${{ github.repository }}
  CNB_IMAGE: longlian.online/longlian-oa-backend

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # 覆盖默认权限后，恢复 Actions cache 需要显式打开。
      actions: read
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Maven cache key
        id: m2key
        run: echo "hash=$(python3 devops/ci/m2-cache-key.py)" >> "$GITHUB_OUTPUT"

      - name: Restore Maven repository
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/m2
          key: m2-${{ runner.os }}-${{ steps.m2key.outputs.hash }}
          restore-keys: |
            m2-${{ runner.os }}-
            maven-${{ runner.os }}-

      - name: Ensure Maven cache directory
        run: mkdir -p .ci-cache/m2

      - name: Inject Maven cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              ".ci-cache/m2": {
                "target": "/root/.m2",
                "id": "m2"
              }
            }
          skip-extraction: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to CNB
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.CNB_REGISTRY }}
          username: cnb
          password: ${{ secrets.GIT_PASSWORD }}

      - name: Extract Docker metadata (app)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
            ${{ env.CNB_REGISTRY }}/${{ env.CNB_IMAGE }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./devops/Dockerfile
          build-args: |
            INCLUDE_OTEL=true
          push: true
          platforms: linux/amd64
          # CNB Docker 制品库拒绝 Buildx 默认附带的 provenance attestation。
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Extract Docker metadata (migration)
        id: meta-migration
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
            ${{ env.CNB_REGISTRY }}/${{ env.CNB_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}-migration
            type=semver,pattern={{major}}.{{minor}}-migration
            type=raw,value=migration-latest

      - name: Build and push migration image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./devops/Dockerfile.migration
          push: true
          platforms: linux/amd64
          # 与应用镜像保持一致，避免 CNB 拒绝 provenance attestation。
          provenance: false
          tags: ${{ steps.meta-migration.outputs.tags }}
          labels: ${{ steps.meta-migration.outputs.labels }}
          annotations: ${{ steps.meta-migration.outputs.annotations }}

  deploy-production:
    name: Deploy production
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: none
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Run production deployment script
        env:
          DEPLOY_SCRIPT_PATH: ${{ secrets.DEPLOY_SCRIPT_PATH }}
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: DEPLOY_SCRIPT_PATH
          script: |
            set -Eeuo pipefail
            : "${DEPLOY_SCRIPT_PATH:?DEPLOY_SCRIPT_PATH is required}"
            "${DEPLOY_SCRIPT_PATH}"
