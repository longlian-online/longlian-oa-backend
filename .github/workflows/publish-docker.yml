# 推送 vX.Y.Z 时只构建并发布该版本的镜像，不部署。
# 应用镜像: :<version>
# 迁移镜像: :<version>-migration
# v1.2.3 → :1.2.3 与 :1.2.3-migration。不推 :latest、:major.minor、:migration-latest。
#
# 正式服部署在 CNB 该标签页手动触发，见 .cnb/tag_deploy.yml。
name: Publish Docker images

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/publish-images.yml
    secrets:
      GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
    with:
      app-tags: |
        type=semver,pattern={{version}}
      migration-tags: |
        type=semver,pattern={{version}}-migration
