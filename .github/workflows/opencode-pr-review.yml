name: opencode-pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4-pro
          prompt: |
            你是一个代码审查助手。请审查这个 Pull Request 的代码变更：

            ## 审查要点
            1. **安全漏洞**: SQL 注入、XSS、敏感信息泄漏、权限绕过、未授权访问
            2. **代码质量**: 空指针风险、资源未释放、异常处理不当、线程安全问题
            3. **架构合规**: 是否遵循项目分层架构 (Controller→Service→Mapper)，请求体是否使用 DTO，响应是否使用 VO
            4. **性能隐患**: N+1 查询、大事务、缓存穿透、无索引查询
            5. **业务逻辑**: 边界条件处理、数据一致性、状态机完整性

            ## 输出要求
            - 在 PR 中以行级评论形式指出具体问题
            - 按严重程度排序 (严重 > 高 > 中 > 低)
            - 每个问题标注所在文件路径和行号
            - 如果代码无问题，输出 LGTM 并通过审查
