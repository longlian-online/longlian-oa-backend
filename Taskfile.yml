# https://taskfile.dev

version: '3'

tasks:
  dev:
    desc: "一键启动开发环境（MySQL + Redis + 迁移 + 种子数据 + 应用）"
    cmds:
      - test -f .env.dev || cp .env.dev.example .env.dev
      - docker compose -f devops/docker-compose.dev.yml up --build -d

  dev-down:
    desc: "停止开发环境（保留数据卷）"
    cmd: docker compose -f devops/docker-compose.dev.yml down

  dev-reset:
    desc: "销毁开发环境含数据卷（下次 up 会重建库和种子）"
    cmd: docker compose -f devops/docker-compose.dev.yml down -v

  prod:
    desc: "启动生产环境（仅迁移 + 后端，依赖外部 MySQL/Redis）"
    cmds:
      - test -f .env.prod || (echo "缺少 .env.prod，请复制 .env.prod.example 并填写外部组件配置" && exit 1)
      - docker compose -f devops/docker-compose.prod.yml --env-file .env.prod up -d

  prod-down:
    desc: "停止生产环境"
    cmd: docker compose -f devops/docker-compose.prod.yml --env-file .env.prod down

  api-test-docker:
    desc: "在 Docker 中运行 API 测试（自动启动 MySQL + Redis）"
    cmd: |
      docker compose -f devops/docker-compose.test.yml up --build --exit-code-from test-runner

  api-test-docker-clean:
    desc: "清理测试容器和数据卷"
    cmd: |
      rm -rf app/target
      docker compose -f devops/docker-compose.test.yml down -v

  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true