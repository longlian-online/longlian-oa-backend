# https://taskfile.dev

version: '3'

includes:
  db: app/src/main/db/Taskfile.yml

tasks:
  api-test-docker:
    desc: "在 Docker 中运行 API 测试（自动启动 MySQL + Redis）"
    cmd: |
      docker compose -f devops/docker-compose.test.yml up --build --exit-code-from test-runner

  api-test-docker-clean:
    desc: "清理测试容器和数据卷"
    cmd: |
      docker compose -f devops/docker-compose.test.yml down -v

  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  dev-prepare:
    desc: "准备开发环境（启动数据库 + 执行迁移）"
    cmds:
      - echo "启动 MySQL 和 Redis..."
      - echo "mysql 监听端口 10001，redis 监听端口 10002"
      - docker compose -f devops/docker-compose.dev.yml up -d mysql-dev redis-dev
      - echo "等待数据库就绪..."
      - docker compose -f devops/docker-compose.dev.yml run --rm mysql-dev sh -c "while ! mysqladmin ping -h mysql-dev -u root -pdev --silent; do sleep 1; done"
      - task: db:update
      - echo "数据库已就绪！"

  dev-run:
    desc: "运行开发环境（构建并启动 API 服务）"
    cmds:
      - task: dev-prepare
      - echo "正在构建并启动 API 服务..."
      - docker compose -f devops/docker-compose.dev.yml up -d --build longlian-oa-dev