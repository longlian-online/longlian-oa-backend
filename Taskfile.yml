# https://taskfile.dev

version: '3'

tasks:
  dev:
    desc: "一键启动开发环境（MySQL + Redis + 迁移 + 种子数据 + 应用）"
    cmds:
      - test -f app/src/main/resources/application.yml || cp app/src/main/resources/application.yml.example app/src/main/resources/application.yml
      - docker compose -f devops/docker-compose.dev.yml up --build -d

  dev-down:
    desc: "停止开发环境（保留数据卷）"
    cmd: docker compose -f devops/docker-compose.dev.yml down

  dev-reset:
    desc: "销毁开发环境含数据卷（下次 up 会重建库和种子）"
    cmd: docker compose -f devops/docker-compose.dev.yml down -v

  prod:
    desc: "启动生产环境（仅迁移 + 后端，依赖外部 MySQL/Redis）"
    cmds:
      - test -f devops/application-prod.yml || (echo "缺少 devops/application-prod.yml，请复制 devops/application-prod.yml.example 并填写" && exit 1)
      - mkdir -p devops/data/storage && chmod 1777 devops/data/storage
      - docker compose -f devops/docker-compose.prod.yml up -d

  prod-down:
    desc: "停止生产环境"
    cmd: docker compose -f devops/docker-compose.prod.yml down

  prod-observability:
    desc: "启动生产环境 + VictoriaLogs + OTel Collector + 日志查询网关（Nginx 外置）"
    cmds:
      - test -f devops/application-prod.yml || (echo "缺少 devops/application-prod.yml，请复制 devops/application-prod.yml.example 并填写" && exit 1)
      - test -n "${LOG_QUERY_AUTH_TOKEN:-}" || (echo "请先设置 LOG_QUERY_AUTH_TOKEN" && exit 1)
      - mkdir -p devops/data/storage devops/data/victorialogs devops/data/otel-collector
      - chmod 1777 devops/data/storage devops/data/victorialogs devops/data/otel-collector
      - docker compose -f devops/docker-compose.prod.yml -f devops/docker-compose.observability.prod.yml up -d --build

  prod-observability-down:
    desc: "停止生产环境可观测性叠加服务"
    cmd: docker compose -f devops/docker-compose.prod.yml -f devops/docker-compose.observability.prod.yml down

  test-docker:
    desc: "在 Docker 中运行全部测试（自动启动 MySQL + Redis）"
    cmd: |
      docker compose -f devops/docker-compose.test.yml up --build --exit-code-from test-runner

  test-docker-clean:
    desc: "清理完整测试容器和数据卷"
    cmd: |
      rm -rf app/target
      docker compose -f devops/docker-compose.test.yml down -v

  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true
