# https://taskfile.dev

version: '3'

includes:
  db: app/src/main/db/Taskfile.yml

tasks:
  api-test-docker:
    desc: "在 Docker 中运行 API 测试（自动启动 MySQL + Redis）"
    cmd: |
      docker compose -f devops/docker-compose.test.yml up --build --exit-code-from test-runner

  api-test-docker-clean:
    desc: "清理测试容器和数据卷"
    cmd: |
      docker compose -f devops/docker-compose.test.yml down -v

  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  dev-prepare:
    desc: "准备开发环境（安装依赖、构建项目等）"
    cmds:
      - echo "准备开发环境..."
      - echo "mysql 默认监听端口 3307，redis 默认监听端口 6379，请确保这些端口未被占用"
      - docker compose -f devops/docker-compose.dev.yml up -d
      - task: db:update
      - echo "开发环境已准备就绪！"