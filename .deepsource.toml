version = 1

exclude_patterns = [
  "generator/**",
  "db/seed/**",
  "**/target/**"
]

[[analyzers]]
name = "java"

  [analyzers.meta]
  runtime_version = "21"

[[analyzers]]
name = "sql"

  [analyzers.meta]
  dialect = "mysql"

[[analyzers]]
name = "docker"

[[analyzers]]
name = "shell"

[[analyzers]]
name = "secrets"

[[analyzers]]
name = "test-coverage"

  [analyzers.meta]
  # JaCoCo XML report generated by api-test.yml and uploaded to DeepSource
  report = "app/target/site/jacoco/jacoco.xml"
